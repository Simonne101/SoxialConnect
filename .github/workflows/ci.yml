# Intégration continue de SoxialConnect (ADR-075). Toute étape obligatoire en échec fait échouer la CI :
# tests, TypeScript, lint, build, audits de dépendances de production, secret détecté.
name: CI

on:
  push:
    branches: [main, "security/**", "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer gitleaks (version figée, empreinte vérifiée)
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}\$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Analyser tout l'historique Git
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: Analyser l'arbre de travail (fichiers suivis)
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: Modèles .env sans secret (valeur vide, null ou numérique uniquement)
        run: |
          set -eu
          templates=".env.example backend/.env.example backend/.env.production.example frontend/.env.example deploy/docker/compose.env.example"
          found=$(grep -HnE '^[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|_KEY)[A-Z0-9_]*=' $templates | grep -vE '=(null|[0-9]+)?[[:space:]]*$' || true)
          if [ -n "$found" ]; then echo "Valeur non vide dans un modèle .env :"; echo "$found" | sed -E 's/=.*/=<masqué>/'; exit 1; fi

  backend:
    name: Backend (PHPUnit, audit Composer)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: sociopulse_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=6
      clamav:
        image: clamav/clamav:1.4.6@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
        ports: ["3310:3310"]
        options: >-
          --health-cmd="clamdcheck.sh" --health-interval=30s --health-timeout=15s --health-retries=20
          --health-start-period=300s
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ci-root
      REDIS_HOST: 127.0.0.1
      # Test EICAR réel contre le vrai démon ClamAV (groupe « clamav »).
      CLAMAV_TEST_HOST: 127.0.0.1
      CLAMAV_TEST_PORT: "3310"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # Mêmes extensions que l'image Docker (deploy/docker/php/install-extensions.sh).
          extensions: gd, exif, intl, zip, pdo_mysql, mbstring, bcmath, pcntl, fileinfo, curl
          coverage: none
          tools: composer:v2
      - name: Outils vidéo (FFmpeg/FFprobe pour les tests d'intégration réels)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Dépendances Composer
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit des dépendances PHP
        run: composer audit --no-interaction
      - name: Configuration de test
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Tests (hors Remotion et whisper, binaires absents de la CI)
        run: php artisan test --exclude-group=remotion,whisper
      - name: Tests de sécurité, de quotas et de configuration de production (rapport dédié)
        run: php artisan test tests/Feature/Security tests/Feature/Auth tests/Unit/SecretRedactorTest.php

  frontend:
    name: Frontend (TypeScript, lint, build, tests, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Lint
        run: npm run lint -- --max-warnings=1 # avertissement existant documenté (ComposerPage, watch())
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Audit des dépendances de production
        run: npm audit --omit=dev

  renderer:
    name: Renderer (audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit des dépendances de production
        run: npm audit --omit=dev

  docker:
    name: Docker (composition, empreintes, construction et contenu des images)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml valide (valeurs factices, aucun secret)
        run: |
          cat > /tmp/compose.env <<'EOF'
          SOXIAL_VERSION=ci
          SERVER_NAME=ci.example.com
          SOXIAL_ENV_FILE=/tmp/backend.env
          LETSENCRYPT_DIR=/tmp/letsencrypt
          MYSQL_PASSWORD=ci-factice
          MYSQL_ROOT_PASSWORD=ci-factice
          REDIS_PASSWORD=ci-factice
          EOF
          docker compose --env-file /tmp/compose.env -f deploy/docker/compose.yaml config -q
      - name: Empreintes des images de base (dérive des étiquettes, empreintes figées disponibles)
        run: sh deploy/docker/scripts/check-image-digests.sh
      - name: Construction des trois images (sans publication)
        run: |
          docker build -f deploy/docker/backend.Dockerfile --target app -t soxialconnect/app:ci .
          docker build -f deploy/docker/backend.Dockerfile --target worker -t soxialconnect/worker:ci .
          docker build -f deploy/docker/web.Dockerfile -t soxialconnect/web:ci .
      - name: Contenu des images (extensions PHP, binaires vidéo, utilisateur non root)
        run: |
          set -eu
          docker run --rm --entrypoint php soxialconnect/app:ci -r 'foreach (["pdo_mysql","intl","zip","gd","exif","bcmath","pcntl","mbstring","openssl","curl","fileinfo","Zend OPcache"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "extension absente : ".$e.PHP_EOL); exit(1); } } if (!defined("PASSWORD_ARGON2ID")) { exit(1); } echo "app : extensions OK".PHP_EOL;'
          docker run --rm --entrypoint id soxialconnect/app:ci | grep -q 'uid=33(www-data)'
          docker run --rm --entrypoint sh soxialconnect/worker:ci -c 'ffmpeg -hide_banner -version | head -1 && ffprobe -hide_banner -version | head -1 && node --version && yt-dlp --version && /opt/whisper/bin/whisper-cli --help >/dev/null 2>&1 && test -s /opt/whisper/models/ggml-base.bin && test -d /opt/renderer/node_modules/@remotion/renderer && id | grep -q "uid=33(www-data)" && echo "worker : binaires OK"'
          docker run --rm --entrypoint nginx soxialconnect/web:ci -V 2>&1 | head -1
      - name: Configuration Nginx valide (certificat auto-signé jetable)
        run: |
          set -eu
          live=/tmp/letsencrypt/live/ci.example.com
          mkdir -p "$live"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci.example.com" -keyout "$live/privkey.pem" -out "$live/fullchain.pem" 2>/dev/null
          chmod 644 "$live"/*.pem
          # Le point d'entrée de l'image génère conf.d/default.conf depuis le modèle quand la commande est « nginx ».
          docker run --rm -e SERVER_NAME=ci.example.com --add-host app:127.0.0.1 -v /tmp/letsencrypt:/etc/letsencrypt:ro soxialconnect/web:ci nginx -t
