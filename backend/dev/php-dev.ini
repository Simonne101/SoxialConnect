; Réglages PHP de DÉVELOPPEMENT pour l'API SoxialConnect.
; Chargés uniquement par `npm run dev` (variable PHP_INI_SCAN_DIR), sans modifier le php.ini système.
; Voir docs/decisions.md ADR-032 (OPcache) et ADR-035 (GD, limites d'upload).

; Images de la médiathèque : réencodage (suppression EXIF/GPS) et vignettes.
extension=gd
extension=exif

; Uploads : alignés sur MEDIA_MAX_* (backend/.env).
upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 256M

; Performances du serveur de développement (php artisan serve).
zend_extension=opcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
