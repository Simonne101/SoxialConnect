# En-têtes de sécurité du site (SPA). L'API ajoute les siens (SecurityHeaders) ; les fichiers médias servis par
# l'API portent une CSP « sandbox ». À inclure dans chaque « location » qui sert la SPA (add_header n'est pas hérité
# quand une location en déclare d'autres).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# - API et médias : même domaine ('self') ; images des réseaux (avatars, miniatures YouTube) en HTTPS ;
# - lecteur YouTube officiel (aperçu du Clipper) : youtube-nocookie.com uniquement ;
# - styles : les composants (Radix) injectent des balises <style>, d'où 'unsafe-inline' pour les styles SEULEMENT.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
