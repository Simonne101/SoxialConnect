# Relais FastCGI vers Laravel (service « app », PHP-FPM). Le code PHP n'existe que dans le conteneur « app » :
# Nginx transmet toujours le contrôleur frontal public/index.php, jamais un chemin fourni par le client.
include fastcgi_params;
fastcgi_pass laravel;
fastcgi_keep_conn on;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param HTTPS on;
fastcgi_param HTTP_PROXY "";
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
# Le client ne peut pas imposer ces en-têtes à Laravel (IP et schéma viennent de la connexion réelle).
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_FORWARDED_PROTO "";
fastcgi_param HTTP_X_FORWARDED_HOST "";
fastcgi_param HTTP_X_FORWARDED_PORT "";
