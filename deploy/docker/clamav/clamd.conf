# clamd pour SoxialConnect (pilote « clamav » du backend, protocole INSTREAM ; ADR-073).
# Les limites de taille DOIVENT couvrir le plus gros import autorisé (MEDIA_MAX_VIDEO_MB = 1 Go par défaut) :
# au-delà de StreamMaxLength, clamd refuse le flux et l'import échoue (jamais considéré comme sain).
Foreground yes
LogFile /dev/stdout
LogTime yes
LogVerbose no
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav

StreamMaxLength 1100M
MaxFileSize 1100M
MaxScanSize 1100M
MaxScanTime 300000
# Fichier trop gros ou trop complexe pour être analysé entièrement : signalé (donc refusé), jamais « sain ».
AlertExceedsMax yes
AlertBrokenExecutables yes
AlertEncrypted yes

# Rechargement des signatures sans doubler la mémoire (pause de l'analyse pendant quelques secondes).
ConcurrentDatabaseReload no
SelfCheck 3600
MaxThreads 4
MaxConnectionQueueLength 30
