; Réglages PHP de PRODUCTION (API et workers). Les limites d'upload suivent MEDIA_MAX_VIDEO_MB (1 Go par défaut)
; et client_max_body_size de Nginx ; les corps JSON restent limités à 1 Mo par l'application (API_MAX_JSON_KB).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 512M
upload_max_filesize = 1100M
post_max_size = 1100M
max_file_uploads = 5
max_execution_time = 120
max_input_time = 600

; Jamais d'inclusion de code distant.
allow_url_include = Off

session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Code figé dans l'image : jamais relu à chaud (redéploiement = nouvelle image).
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
