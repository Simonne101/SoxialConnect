; Pool PHP-FPM de l'API (www-data, port 9000 sur le réseau interne uniquement).
[www]
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Requêtes bloquées : coupées et journalisées (uploads compris, voir max_input_time).
request_terminate_timeout = 660s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
; Vérification de santé (HEALTHCHECK de l'image) — jamais exposée par Nginx.
ping.path = /fpm-ping
ping.response = pong
